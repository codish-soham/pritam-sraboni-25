<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pritam &amp; Sraboni – 25th Wedding Anniversary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4d6;--card:#fffaf0;--ink:#4a1010;--gold:#b8860b;--accent:#9b111e;--on-accent:#fff;--env:#7d1424;--env2:#661020;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1408;--card:#2b1d0e;--ink:#f6e3b4;--gold:#e0b84a;--accent:#d8394a}}
:root[data-theme="dark"]{--bg:#1e1408;--card:#2b1d0e;--ink:#f6e3b4;--gold:#e0b84a;--accent:#d8394a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Playfair Display',Georgia,serif;text-align:center}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity 1s ease;padding:16px}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:1.25rem;color:var(--gold);letter-spacing:.04em;font-weight:500}
#intro p{margin:0;font-size:.9rem;opacity:.85}
.env{position:relative;width:min(86vw,340px);aspect-ratio:3/2;background:var(--env2);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.35);perspective:900px;animation:float 3s ease-in-out infinite}
.env.open{animation:none}
@keyframes float{50%{transform:translateY(-8px)}}
.letter{position:absolute;left:6%;right:6%;bottom:5%;height:88%;background:#fffaf0;color:#4a1010;border:2px solid #b8860b;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform 1.1s ease .9s;z-index:1}
.letter b{font-size:1.5rem;color:#9b111e}.letter span{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.env.open .letter{transform:translateY(-62%)}
.tri{position:absolute;inset:0;z-index:2}
.l{background:var(--env);clip-path:polygon(0 0,52% 52%,0 100%)}
.r{background:var(--env);clip-path:polygon(100% 0,48% 52%,100% 100%)}
.bt{background:#8c182a;clip-path:polygon(0 100%,50% 45%,100% 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:62%;background:#92192b;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease,z-index 0s .45s;z-index:4}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:46%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:0;z-index:5;cursor:pointer;color:#fff3c4;font:700 1.1rem 'Playfair Display',Georgia,serif;background:radial-gradient(circle at 35% 30%,#e0b84a,#a8741a);box-shadow:0 3px 8px rgba(0,0,0,.5);transition:opacity .4s}
.env:not(.open) .seal{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.env.open .seal{opacity:0;pointer-events:none}
#invite{opacity:0;visibility:hidden;transition:opacity 1.2s ease}
#invite.show{opacity:1;visibility:visible}
main{max-width:520px;margin:0 auto;padding:30px 16px 90px}
.hero{border:2px solid var(--gold);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.hero img{display:block;width:100%;height:auto}
h2{margin:28px 0 10px;font-size:1.3rem;color:var(--gold)}
#count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#count div{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:12px 4px}
#count b{display:block;font-size:1.7rem;color:var(--accent)}
#count span{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.btns{display:grid;gap:10px;margin-top:8px}
.btn{display:block;padding:14px;border-radius:12px;background:var(--accent);color:var(--on-accent);text-decoration:none;font:700 1rem 'Playfair Display',Georgia,serif;border:0;cursor:pointer;width:100%}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--gold)}
small{display:block;margin-top:28px;opacity:.8}
#mute{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer;display:none}
.petal{position:fixed;top:-30px;z-index:25;pointer-events:none;width:12px;height:16px;border-radius:70% 0 70% 0;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.env{animation:none}.petal{display:none}}
.gar{display:block;width:100%;max-width:640px;margin:0 auto;position:relative;z-index:1;overflow:visible}
.gi{position:absolute;left:50%;transform:translateX(-50%);z-index:0}.gi.t{top:0}.gi.b{bottom:0}
.tw{animation:tw 2.6s ease-in-out infinite}@keyframes tw{50%{opacity:.6}}
#bgp{position:fixed;inset:0;z-index:0;pointer-events:none}
.frame{position:fixed;inset:6px;z-index:2;pointer-events:none;border:2px solid var(--gold);border-radius:10px;outline:1px solid var(--gold);outline-offset:-8px}
main{position:relative;z-index:1}
#intro h1,.env,#intro p{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.tw{animation:none}}
#flora div{position:fixed;z-index:0;pointer-events:none;width:min(40vw,180px)}
#flora svg{display:block;width:100%;height:auto}
#flora .tl{top:0;left:0}#flora .tr{top:0;right:0;transform:scaleX(-1)}
#flora .bl{bottom:0;left:0;transform:scaleY(-1)}#flora .br{bottom:0;right:0;transform:scale(-1,-1)}
.frame{z-index:0}
